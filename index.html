<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Head-Fu Remake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120f1d;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        overscroll-behavior: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      canvas {
        display: block;
        outline: none;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <script src="js/util.js"></script>
    <script src="js/input.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/music.js"></script>
    <script src="js/fighters.js"></script>
    <script src="js/faces.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/stages.js"></script>
    <script src="js/fighter.js"></script>
    <script src="js/battle.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/match.js"></script>
    <script src="js/scenes.js"></script>
    <script src="js/story.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
